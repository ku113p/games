# Deploy to GitHub Pages on a push to main. Once per repository: Settings -> Pages -> Source: "GitHub Actions".
# No base path is needed in the workflow: the build uses relative paths throughout (see tools/build.ts),
# so the site works at /<repo>/ and /<repo>/<game>/ whatever the repository is called.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install, test, lint every game
        run: |
          for d in games/*/; do
            [ -f "$d/package.json" ] || continue
            echo "== $d"
            (cd "$d" && bun install --frozen-lockfile && bun test && bun run lint:layers)
          done
      - name: Build all games and the landing
        run: bun tools/build.ts
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
