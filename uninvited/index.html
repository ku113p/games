<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uninvited</title>
    <style>
      :root { --cyan: #6ff4ff; --red: #ff3646; --amber: #ffb03a; --white: #eef8ff; --dim: rgba(160, 230, 255, 0.55); }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--white);
        font: 14px/1.4 ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace; user-select: none; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      .hud { position: absolute; inset: 0; }
      .hud-top { position: absolute; top: 2vh; left: 50%; transform: translateX(-50%); text-align: center; min-width: 280px; }
      .hud-status { display: inline-block; padding: 0.2em 0.9em; letter-spacing: 0.3em; font-size: clamp(14px, 1.9vh, 24px); font-weight: 700; color: var(--cyan); background: rgba(0, 8, 14, 0.55);
        border: 1px solid currentColor; text-shadow: 0 0 8px currentColor; box-shadow: 0 0 12px -4px currentColor; }
      .hud-status.suspected { color: var(--amber); }
      .hud-status.detected { color: var(--red); animation: blink 0.4s steps(2) infinite; }
      .hud-status.niche { color: #9fd8ff; border-style: dashed; }
      .hud-sus { width: clamp(160px, 18vh, 240px); height: clamp(3px, 0.5vh, 6px); margin: 6px auto 0; background: rgba(255,255,255,0.08); visibility: hidden; }
      .hud-sus-fill { height: 100%; width: 0; background: var(--amber); box-shadow: 0 0 8px var(--amber); }
      .hud-alarm { margin-top: 0.9vh; font-size: clamp(12px, 1.5vh, 18px); letter-spacing: 0.25em; color: #bff7ff; }
      .hud-alarm-label { margin-right: 8px; }
      .hud-pip { display: inline-block; width: clamp(22px, 2.8vh, 36px); height: clamp(6px, 0.9vh, 11px); margin: 0 3px; border: 1px solid rgba(255, 70, 80, 0.5); vertical-align: middle; }
      .hud-pip.on { background: var(--red); box-shadow: 0 0 10px var(--red); border-color: var(--red); }
      .hud-top.alarm3 .hud-pip.on { animation: blink 0.5s steps(2) infinite; }
      .hud-status.hidden { color: #8ff0ff; }
      .hud-decay { width: 100px; height: 2px; margin: 5px auto 0; background: rgba(255,255,255,0.08); visibility: hidden; }
      .hud-decay-fill { height: 100%; background: var(--red); }
      .hud-wave { margin-top: 6px; color: var(--red); letter-spacing: 0.25em; font-size: clamp(13px, 1.7vh, 21px); text-shadow: 0 0 8px var(--red); }
      @keyframes blink { 50% { opacity: 0.45; } }
      .hud-left { position: absolute; left: 2.4vw; bottom: 3vh; width: clamp(240px, 27vh, 360px); }
      .hud-right { position: absolute; right: 2.4vw; bottom: 3vh; width: clamp(220px, 25vh, 340px); text-align: right; }
      .hud-label { font-size: clamp(12px, 1.3vh, 16px); letter-spacing: 0.25em; color: #bff7ff; margin-top: 0.8vh; }
      .hud-label.small { font-size: clamp(11px, 1.2vh, 15px); }
      .hud-bar { height: clamp(6px, 0.9vh, 11px); margin-top: 4px; background: rgba(255,255,255,0.08); position: relative; }
      .hud-bar.thin { height: clamp(3px, 0.5vh, 7px); width: 70%; }
      .hud-right .hud-bar.thin { margin-left: auto; }
      .hud-bar-fill { height: 100%; width: 100%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
      .hud-bar.low .hud-bar-fill { background: var(--red); box-shadow: 0 0 10px var(--red); }
      .hud-bar.scan.active .hud-bar-fill { background: #b8f6ff; }
      .hud-bar.scan.hot .hud-bar-fill { background: var(--red); box-shadow: 0 0 10px var(--red); }
      .hud-bar.scan.cool .hud-bar-fill { background: rgba(110, 200, 230, 0.5); box-shadow: none; }
      .hud-mode { letter-spacing: 0.25em; font-size: clamp(13px, 1.6vh, 20px); }
      .hud-mode-tag { margin-left: 12px; color: rgba(200, 240, 255, 0.6); }
      .hud-mode-tag.on { color: var(--white); text-shadow: 0 0 10px var(--cyan); border-bottom: 1px solid var(--cyan); }
      .hud-charges { margin-top: 4px; font-size: clamp(12px, 1.4vh, 17px); color: var(--dim); }
      .hud-charges.empty { color: var(--red); }
      .hud-cross { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
        border: 1px solid rgba(220, 250, 255, 0.8); box-shadow: 0 0 6px var(--cyan); }
      .hud-cross.rifle { width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 0; border-color: transparent;
        background: linear-gradient(var(--white), var(--white)) center/2px 6px no-repeat, linear-gradient(90deg, var(--white), var(--white)) center/6px 2px no-repeat; }
      .hud-toasts { position: absolute; left: 50%; top: 17%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .toast { padding: 0.25em 1em; letter-spacing: 0.25em; font-size: clamp(15px, 2vh, 26px); color: var(--cyan); background: rgba(0, 8, 14, 0.55);
        text-shadow: 0 0 10px currentColor; transition: opacity 0.6s; white-space: nowrap; }
      .toast.alarm { color: var(--red); }
      .toast.good { color: #c9fff1; }
      .toast.out { opacity: 0; }
      .screens { position: absolute; inset: 0; display: none; pointer-events: auto; }
      .screens.on { display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, rgba(0, 4, 8, 0.45), rgba(0, 0, 0, 0.9)); }
      .screen { text-align: center; max-width: 720px; padding: 24px; }
      .screen.start, .screen.pause, .screen.resume { cursor: pointer; }
      .screen h1 { font-weight: 300; letter-spacing: 20px; font-size: 56px; margin: 0 0 8px; color: var(--white); text-shadow: 0 0 22px var(--cyan); }
      .screen h2 { font-weight: 300; letter-spacing: 12px; font-size: 36px; margin: 0 0 12px; text-shadow: 0 0 18px var(--cyan); }
      .screen.dead h2 { color: var(--red); text-shadow: 0 0 18px var(--red); }
      .screen .tagline { opacity: 0.85; }
      .screen .note { opacity: 0.6; font-size: 12px; }
      .screen .go { display: inline-block; margin: 22px 0 16px; padding: 10px 28px; letter-spacing: 5px; color: var(--cyan);
        border: 1px solid currentColor; box-shadow: 0 0 18px -4px currentColor; text-shadow: 0 0 10px currentColor; }
      .controls { display: inline-grid; grid-template-columns: auto auto; gap: 3px 18px; text-align: left; font-size: 12px; margin: 6px 0 10px; }
      .controls-row { display: contents; }
      .controls .key { color: var(--cyan); text-align: right; }
      .controls .what { opacity: 0.8; }
      .buttons { display: flex; gap: 16px; justify-content: center; margin-top: 18px; }
      .btn { font: inherit; letter-spacing: 3px; padding: 10px 22px; color: var(--cyan); background: rgba(0, 10, 16, 0.6);
        border: 1px solid var(--cyan); cursor: pointer; text-shadow: 0 0 8px currentColor; margin-top: 16px; }
      .btn:hover { background: rgba(40, 200, 255, 0.15); }
      .hack-root { position: absolute; inset: 0; pointer-events: none; }
      .hack-root.on { pointer-events: auto; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; letter-spacing: 6px; color: var(--cyan); }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <div id="loading">LOADING</div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
