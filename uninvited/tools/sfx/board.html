<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uninvited SFX board</title>
<!-- Generated by tools/sfx/build.ts from tools/sfx/board.html - edit the template, not this file. -->
<style>
  :root {
    --bg: #05070a;
    --panel: #0b1016;
    --line: #12303a;
    --text: #cfe9ee;
    --dim: #6f8c94;
    --cyan: #34e7f2;
    --red: #ff3b52;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  }
  header {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    align-items: center;
    padding: 14px 16px;
    background: rgba(5, 7, 10, 0.92);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  h1 { margin: 0; font-size: 16px; letter-spacing: 0.2em; color: var(--cyan); text-shadow: 0 0 12px rgba(52, 231, 242, 0.6); }
  header label { color: var(--dim); display: flex; align-items: center; gap: 8px; }
  input[type=range] { accent-color: var(--cyan); }
  input[type=search] {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 6px 8px; font: inherit; min-width: 160px;
  }
  main { padding: 8px 16px 48px; max-width: 1400px; margin: 0 auto; }
  h2 {
    margin: 28px 0 10px; font-size: 13px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--dim);
    border-bottom: 1px solid var(--line); padding-bottom: 6px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
  .card.hidden { display: none; }
  .name { color: var(--text); font-weight: 600; }
  .meta { color: var(--dim); font-size: 12px; margin: 2px 0 8px; }
  .buttons { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    min-width: 44px; min-height: 34px; padding: 4px 10px; cursor: pointer;
    background: transparent; color: var(--cyan); border: 1px solid var(--cyan); border-radius: 4px; font: inherit;
  }
  button:active, button.flash { background: var(--cyan); color: var(--bg); box-shadow: 0 0 14px rgba(52, 231, 242, 0.7); }
  button.rnd { color: var(--text); border-color: var(--dim); }
  button.loop.on { background: var(--red); border-color: var(--red); color: var(--bg); box-shadow: 0 0 14px rgba(255, 59, 82, 0.7); }
  button.stop { color: var(--red); border-color: var(--red); }
  .err { color: var(--red); }
</style>
</head>
<body>
<header>
  <h1>UNINVITED // SFX</h1>
  <label>volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
  <input id="find" type="search" placeholder="filter...">
  <button class="stop" id="stop">stop all</button>
  <span class="meta" id="status"></span>
</header>
<main id="main"></main>
<script>
const SOUNDS = /*MANIFEST*/[];

let ctx = null;
let master = null;
const cache = new Map();
const playing = new Set();
const loops = new Map();

function audio() {
  if (!ctx) {
    ctx = new AudioContext();
    master = ctx.createGain();
    master.gain.value = Number(document.getElementById("vol").value);
    master.connect(ctx.destination);
  }
  return ctx;
}

async function load(entry) {
  if (!cache.has(entry.file)) {
    cache.set(entry.file, fetch(entry.file)
      .then((r) => { if (!r.ok) throw new Error(r.status + " " + entry.file); return r.arrayBuffer(); })
      .then((data) => audio().decodeAudioData(data)));
  }
  return cache.get(entry.file);
}

// MP3 adds encoder padding. Browsers that read the LAME header strip it (decoded length == samples);
// otherwise skip the leading priming silence so the loop stays seamless.
function loopRegion(buffer, entry) {
  const sr = buffer.sampleRate;
  const expected = Math.round(entry.samples * sr / 44100);
  if (buffer.length <= expected + 1) return [0, buffer.length / sr];
  const data = buffer.getChannelData(0);
  let lead = 0;
  const maxLead = Math.min(buffer.length - expected, 4096);
  while (lead < maxLead && Math.abs(data[lead]) < 1e-5) lead++;
  return [lead / sr, (lead + expected) / sr];
}

async function play(entry, button) {
  try {
    const buffer = await load(entry);
    const src = audio().createBufferSource();
    src.buffer = buffer;
    src.connect(master);
    if (entry.loop) {
      const [a, b] = loopRegion(buffer, entry);
      src.loop = true;
      src.loopStart = a;
      src.loopEnd = b;
      src.start(0, a);
      loops.set(entry.file, src);
    } else {
      src.start();
      playing.add(src);
      src.onended = () => playing.delete(src);
      button.classList.add("flash");
      setTimeout(() => button.classList.remove("flash"), 120);
    }
    status(entry.file + "  " + entry.seconds.toFixed(2) + " s");
  } catch (e) {
    status("could not play " + entry.file + ": " + e.message + " (open the board through a local server)", true);
  }
}

function stopLoop(file) {
  const src = loops.get(file);
  if (src) { src.stop(); loops.delete(file); }
}

function status(text, err) {
  const s = document.getElementById("status");
  s.textContent = text;
  s.className = "meta" + (err ? " err" : "");
}

function build() {
  const main = document.getElementById("main");
  const groups = new Map();
  for (const e of SOUNDS) {
    if (!groups.has(e.category)) groups.set(e.category, new Map());
    const g = groups.get(e.category);
    if (!g.has(e.group)) g.set(e.group, []);
    g.get(e.group).push(e);
  }
  for (const [cat, g] of groups) {
    const h = document.createElement("h2");
    h.textContent = cat;
    main.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "grid";
    main.appendChild(grid);
    for (const [name, entries] of g) {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.find = (name + " " + entries[0].desc).toLowerCase();
      const secs = entries.map((e) => e.seconds);
      const lo = Math.min(...secs).toFixed(2);
      const hi = Math.max(...secs).toFixed(2);
      const len = lo === hi ? lo + " s" : lo + "-" + hi + " s";
      card.innerHTML = '<div class="name"></div><div class="meta"></div><div class="buttons"></div>';
      card.querySelector(".name").textContent = name;
      card.querySelector(".meta").textContent = entries[0].desc + "  [" + len + (entries[0].loop ? ", loop" : "") + "]";
      const row = card.querySelector(".buttons");
      for (const e of entries) {
        const b = document.createElement("button");
        b.textContent = e.loop ? "loop" : entries.length > 1 ? "v" + e.variant : "play";
        if (e.loop) {
          b.className = "loop";
          b.onclick = () => {
            if (loops.has(e.file)) { stopLoop(e.file); b.classList.remove("on"); }
            else { b.classList.add("on"); play(e, b); }
          };
        } else {
          b.onclick = () => play(e, b);
        }
        row.appendChild(b);
      }
      if (entries.length > 1) {
        const r = document.createElement("button");
        r.className = "rnd";
        r.textContent = "rnd";
        r.onclick = () => play(entries[Math.floor(Math.random() * entries.length)], r);
        row.appendChild(r);
      }
      grid.appendChild(card);
    }
  }
  status(SOUNDS.length + " files");
}

document.getElementById("vol").oninput = (ev) => { if (master) master.gain.value = Number(ev.target.value); };
document.getElementById("stop").onclick = () => {
  for (const s of playing) s.stop();
  playing.clear();
  for (const f of [...loops.keys()]) stopLoop(f);
  document.querySelectorAll("button.loop.on").forEach((b) => b.classList.remove("on"));
};
document.getElementById("find").oninput = (ev) => {
  const q = ev.target.value.trim().toLowerCase();
  document.querySelectorAll(".card").forEach((c) => c.classList.toggle("hidden", q !== "" && !c.dataset.find.includes(q)));
};
build();
</script>
</body>
</html>
