<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uninvited - first-person room test</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #e8f6ff;
        font: 14px/1.4 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; user-select: none; }
      canvas { display: block; width: 100vw; height: 100vh; }
      canvas.pointer { cursor: pointer; }

      #stats { position: fixed; right: 10px; top: 10px; padding: 6px 9px; background: rgba(0, 0, 0, 0.55);
        font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; color: #8fe8ff; white-space: pre; pointer-events: none; }
      #stats.hidden { display: none; }

      /* label that follows the cursor over a prop */
      #label { position: fixed; left: 0; top: 0; pointer-events: none; padding: 4px 10px 4px 8px;
        font: 600 12px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.12em; text-transform: uppercase;
        color: #ffe6c2; background: rgba(10, 8, 6, 0.55); border-left: 2px solid #ffb35c;
        text-shadow: 0 0 8px rgba(255, 170, 80, 0.6); opacity: 0; transition: opacity 0.12s, transform 0.12s; }
      #label.on { opacity: 1; }

      /* click to start */
      #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.9)); text-shadow: 0 0 12px #000; cursor: pointer;
        transition: opacity 0.6s; }
      #start.gone { opacity: 0; pointer-events: none; }
      #start h1 { margin: 0; font: 600 13px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.4em; color: #7fdcff; opacity: 0.8; }
      #start .go { font: 300 32px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.08em;
        animation: breathe 2.4s ease-in-out infinite; }
      #start small { color: #8aa3b3; letter-spacing: 0.05em; }
      @keyframes breathe { 50% { opacity: 0.45; } }

      /* tablet news: mapped onto the empty glowing screen of the close-up with a matrix3d (set in code).
         Multiply blending lets the cyan glow of the picture show through the "ink". */
      #news { position: fixed; left: 0; top: 0; width: 640px; height: 416px; transform-origin: 0 0; pointer-events: none;
        box-sizing: border-box; padding: 26px 64px 24px 34px; color: #06222c; mix-blend-mode: multiply;
        opacity: 0; transition: opacity 0.35s; display: none; }
      #news.on { opacity: 1; }
      #news .bar { display: flex; justify-content: space-between; font: 700 14px/1 ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: 0.2em; color: #0b4a5c; border-bottom: 2px solid #1b6f86; padding-bottom: 10px; }
      #news .tag { display: inline-block; margin-top: 14px; padding: 4px 10px; font: 700 14px/1 ui-monospace, Menlo, monospace;
        letter-spacing: 0.18em; color: #fff; background: #b0123a; mix-blend-mode: normal; }
      #news h2 { margin: 10px 0 10px; font: 800 38px/1.02 ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.01em; }
      #news .row { display: flex; gap: 18px; }
      #news img { width: 250px; height: 141px; flex: none; object-fit: cover; filter: contrast(1.15) saturate(0.8); }
      #news p { margin: 0; font: 600 19px/1.3 ui-sans-serif, system-ui, sans-serif; color: #0d3542; }
      #news .tick { margin-top: 14px; font: 700 13px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.1em; color: #155a6d;
        white-space: nowrap; overflow: hidden; }
      #news.on .row { animation: swipeIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      #news.on h2 { animation: swipeIn 0.45s 0.05s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      @keyframes swipeIn { from { transform: translateX(80px); opacity: 0; } }

      /* jack-in confirm */
      #confirm { position: fixed; left: 50%; bottom: 9vh; transform: translate(-50%, 12px); display: none; opacity: 0;
        transition: opacity 0.25s, transform 0.25s; text-align: center; padding: 18px 22px 20px; min-width: 300px;
        background: rgba(2, 14, 20, 0.72); border: 1px solid rgba(90, 220, 255, 0.45);
        box-shadow: 0 0 30px rgba(40, 200, 255, 0.25), inset 0 0 18px rgba(40, 200, 255, 0.12); backdrop-filter: blur(3px); }
      #confirm.on { opacity: 1; transform: translate(-50%, 0); }
      #confirm .q { font: 600 26px/1.1 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.06em; color: #dff8ff;
        text-shadow: 0 0 12px rgba(80, 220, 255, 0.7); margin-bottom: 16px; }
      .btn { min-width: 120px; min-height: 48px; margin: 0 6px; padding: 0 18px; cursor: pointer;
        font: 700 14px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.2em; text-transform: uppercase;
        color: #dff8ff; background: rgba(10, 40, 52, 0.7); border: 1px solid rgba(120, 230, 255, 0.5); transition: background 0.12s, box-shadow 0.12s; }
      .btn:hover, .btn:focus-visible { background: rgba(30, 120, 150, 0.75); box-shadow: 0 0 16px rgba(80, 220, 255, 0.5); outline: none; }
      .btn.primary { border-color: #6ff0ff; color: #fff; }
      .btn.ghost { color: #9fc4d0; border-color: rgba(120, 180, 200, 0.35); }

      #jackout { position: fixed; right: 24px; bottom: 24px; display: none; opacity: 0; transition: opacity 0.5s; }
      #jackout.on { opacity: 1; }

      #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); color: rgba(220, 240, 255, 0.45);
        font: 12px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.08em; pointer-events: none; transition: opacity 0.4s; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="label"></div>
    <div id="news">
      <!-- PLACEHOLDER news copy for the engine test, not the game's text -->
      <div class="bar"><span>NEC NEWSFEED</span><span id="news-time">07:42</span></div>
      <span class="tag">BREAKING</span>
      <h2>Shuseki: another wave of layoffs</h2>
      <div class="row">
        <img id="news-img" alt="" />
        <p>12,000 employees exiled to the Free Territories this morning. "Restructuring," says the board.</p>
      </div>
      <div class="tick">MARKETS +2.4% &nbsp;/&nbsp; SHUSEKI +6.1% &nbsp;/&nbsp; RAIN ALL WEEK</div>
    </div>
    <div id="confirm">
      <div class="q">Jack in?</div>
      <button class="btn primary" id="yes">Confirm</button>
      <button class="btn ghost" id="no">Cancel</button>
    </div>
    <button class="btn" id="jackout">Jack out</button>
    <div id="hint"></div>
    <div id="stats"></div>
    <div id="start">
      <h1>UNINVITED · ROOM TEST</h1>
      <div class="go">Click to start</div>
      <small>sound on · H hides the stats</small>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
