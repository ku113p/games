<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uninvited - hacking mini-game test</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #cfefff;
        font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
      #stage { position: fixed; inset: 46px 0 0 0; background: #000 center / cover no-repeat; }
      #bench { position: fixed; left: 0; right: 0; top: 0; height: 46px; box-sizing: border-box; z-index: 100; display: flex;
        align-items: center; gap: 12px; padding: 0 10px; font-size: 12px; background: #02070a; border-bottom: 1px solid #1f4a5a; white-space: nowrap; }
      body.full #stage { top: 0; }
      body.full #bench { background: transparent; border: 0; width: max-content; }
      #bench label { display: flex; align-items: center; gap: 6px; color: #8fb8c4; }
      #bench input[type=range] { width: 100px; accent-color: #5ef2ff; }
      #bench input[type=number] { width: 52px; background: #07141b; color: #cfefff; border: 1px solid #2a6378; font: inherit; padding: 3px 5px; }
      #bench button { background: #07141b; color: #cfefff; border: 1px solid #2a6378; padding: 5px 10px; cursor: pointer; font: inherit; border-radius: 6px; }
      #bench button:hover { border-color: #5ef2ff; }
      #params { color: #5ef2ff; }
      #result { color: #e2fdff; min-width: 16ch; }
      #result.win { color: #5ef2ff; }
      #result.fail { color: #ff2d4b; }
      body.full #bench > :not(#toggle) { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="bench">
      <button id="toggle" title="hide the bench: the overlay gets the whole window, as in the game">full</button>
      <label>difficulty <input id="difficulty" type="range" min="0" max="1" step="0.05" value="0.3" /> <span id="dval">0.30</span></label>
      <span id="params"></span>
      <label>May +s <input id="bonus" type="number" min="0" max="120" step="1" value="0" /></label>
      <label>seed <input id="seed" type="number" min="0" step="1" placeholder="random" /></label>
      <label><input id="freeze" type="checkbox" /> freeze</label>
      <button id="new">new puzzle (N)</button>
      <span id="result"></span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
