<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uninvited - engine room test</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #cfefff;
        font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
      canvas { display: block; width: 100vw; height: 100vh; }
      canvas.pixel { image-rendering: pixelated; }
      #ui { position: fixed; left: 12px; top: 12px; background: rgba(0,0,0,0.6); padding: 10px 12px; border: 1px solid #1f4a5a; }
      #ui button { background: #07141b; color: #cfefff; border: 1px solid #2a6378; padding: 6px 10px; margin: 2px; cursor: pointer; font: inherit; }
      #ui button.on { background: #1b5266; }
      #ui label { display: block; margin-top: 6px; }
      #stats { margin-top: 8px; white-space: pre; color: #8fe8ff; }
      #toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 16px;
        border-left: 2px solid #ffb347; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
      #toast.on { opacity: 1; }
      #hint { position: fixed; pointer-events: none; color: #ffe2b0; text-shadow: 0 0 6px #000; font-size: 12px; transform: translate(-50%, -140%); }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="ui">
      <div>
        <button data-mode="plate">1 · 2.5D plate</button>
        <button data-mode="full">2 · full 3D</button>
        <button data-mode="pixel">3 · 3D pixelated</button>
      </div>
      <label><input type="checkbox" id="char" checked /> character (placeholder model)</label>
      <label><input type="checkbox" id="ao" checked /> ambient occlusion (3D)</label>
      <div id="stats"></div>
    </div>
    <div id="hint"></div>
    <div id="toast"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
